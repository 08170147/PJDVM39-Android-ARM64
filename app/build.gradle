plugins { id 'com.android.application' }

android {
    namespace 'com.local.pjdvm39'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.pjdvm39'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0-port-skeleton'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++20 -Wall -Wextra' }
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}
